name: Flutter CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pinned to the version P-001 was actually validated against on
          # the real machine (Flutter 3.29.3 / Dart 3.7.2). Bump deliberately
          # alongside pubspec.yaml's environment constraint, not casually.
          flutter-version: "3.29.3"
          channel: "stable"

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test