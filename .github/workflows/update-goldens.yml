name: Update goldens

on:
  pull_request:
    types: [labeled]

permissions:
  contents: write

jobs:
  update-goldens:
    if: github.event.label.name == 'update-goldens'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --update-goldens
      - name: Commit regenerated goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/goldens
          if git diff --cached --quiet; then
            echo "No golden changes."
          else
            git commit -m "test(goldens): regenerate baselines on Linux CI"
            git push
          fi