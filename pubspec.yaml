name: social_commerce_app
description: "Social Commerce Discovery Platform — mobile app (Customer / Trader-Factory / Admin surfaces share this codebase per Section 12)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (mandated by architecture — Riverpod, not Bloc/Provider)
  flutter_riverpod: 3.3.2

  # Declarative routing (Part P-007). Pinned to 15.1.3, the last version
  # whose stated floor is Flutter 3.27/Dart 3.6 — matching this project's
  # own environment floor above exactly. go_router 15.2.0+ (and all 16.x)
  # bump their floor to Flutter 3.29/Dart 3.7, which the validated
  # real-machine Flutter 3.29.3/Dart 3.7.2 from P-001 also satisfies — so
  # bumping later is safe, but there's no need to require it yet.
  go_router: ^15.1.3

  # HTTP client for future networking layer (lib/core/network)
  dio: ^5.11.0

  # Encrypted local storage for future auth-token persistence (lib/core/storage)
  flutter_secure_storage: ^10.3.1

  # Non-sensitive local cache backing for CacheStorage (lib/core/storage) —
  # tokens never use this, see secure_token_storage.dart. Pinned to 2.5.3:
  # shared_preferences 2.5.4+ requires Flutter >=3.35.0, which is newer
  # than this project's validated Flutter 3.29.3 — the resolver would
  # otherwise silently pick a version that fails to resolve on this SDK,
  # the same class of issue P-001 hit with flutter_riverpod.
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8

  # International phone number input for the Business onboarding/edit
  # forms (Part P-028B), producing an E.164-formattable value to match
  # P-027's backend validation exactly. Pinned to 3.2.0, the current
  # latest on pub.dev at authoring time. ⚠️ Flagged (see
  # business_onboarding_screen.dart's own class docstring, point 4):
  # this package's last real release was published in 2023 and it is
  # not under active development, though it is NOT marked discontinued
  # on pub.dev and has no dependencies beyond the Flutter SDK itself. If
  # `flutter pub get`/`flutter analyze` surface a real incompatibility
  # against this project's pinned flutter_riverpod: 3.3.2 / Flutter
  # >=3.27.0 floor on the real machine, `intl_phone_field_v2` (an
  # actively-maintained fork with the same widget API) is a drop-in
  # replacement — swap this line and the import only, no other files
  # need to change.
  intl_phone_field: ^3.2.0

  # Image selection for the Business-console product create/edit form
  # (Part P-033) — the first content-creation screen in this app to
  # need an image upload; no prior multipart-upload precedent exists
  # anywhere else in this repo. Pinned to 1.2.1, current stable on
  # pub.dev at authoring time. Its own CHANGELOG bumps the minimum
  # supported SDK to Flutter 3.29/Dart 3.7 — above this project's
  # stated pubspec floor (Flutter >=3.27.0) but already satisfied by
  # the real validated machine (Flutter 3.29.3/Dart 3.7.2, confirmed
  # since Part P-001) — same situation already flagged for go_router's
  # own pinned version above.
  image_picker: ^1.2.1
  share_plus: 12.0.0

  # Cross-platform WebSocket client for the global chat connection
  # (Part P-073). Pinned to 3.0.3, current stable on pub.dev at
  # authoring time — its own pubspec declares `sdk: ^3.3.0`, comfortably
  # below this project's floor (Dart >=3.7.0), so no version-floor
  # conflict of the kind flagged for go_router/image_picker above.
  web_socket_channel: ^3.0.3


  # Firebase Cloud Messaging (Part P-081). Pinned to the 3.x / 15.x lines
  # because the validated toolchain is Flutter 3.29.3 / Dart 3.7.2 —
  # firebase_core 4.x / firebase_messaging 16.x require a much newer
  # Flutter. Bump both together (never one without the other) when the
  # project's Flutter floor moves. Without google-services.json /
  # GoogleService-Info.plist (architecture Section 7 item 4) Firebase
  # simply fails to initialise and FcmService becomes a safe no-op.
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Charting for the Business Console Analytics screen (Part P-085).
  # No charting package existed in this project before. Pinned exactly
  # to 1.1.0 (same pinning discipline as share_plus/go_router above):
  # its SDK floor is Dart >=3.6.2 / Flutter >=3.27.4, below this
  # project's own Dart >=3.7.0 floor and the validated Flutter
  # 3.29.3 / Dart 3.7.2, and its only dependencies are equatable and vector_math ^2.1.4.
  # 1.1.0 is the newest fl_chart that still accepts the vector_math 2.1.4
  # pinned by flutter_test on the validated SDK (1.1.1+ need ^2.2.0 and
  # fail to resolve).
  fl_chart: 1.0.0

  # Crash / error reporting (Part P-105, Phase 21). Backs reportError() in
  # lib/core/error_reporting.dart. Pinned exactly (same discipline as
  # share_plus/fl_chart above). 9.30.1 declares Dart >=3.5 / Flutter >=3.24,
  # below this project's validated Flutter 3.29.3 / Dart 3.7.2. Initialization
  # (SentryFlutter.init in main.dart) is added in P-105 STEP 5; until then
  # Sentry is not initialized and every capture call is a harmless no-op.
  sentry_flutter: 9.30.1
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Mocks Dio's HTTP adapter for the P-004 network-layer unit tests
  # (test/core/network/) — lets us assert on status codes/bodies without
  # a real backend running.
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true