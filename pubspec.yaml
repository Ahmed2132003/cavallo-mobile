name: social_commerce_app
description: "Social Commerce Discovery Platform — mobile app (Customer / Trader-Factory / Admin surfaces share this codebase per Section 12)."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (mandated by architecture — Riverpod, not Bloc/Provider)
  flutter_riverpod: 3.3.2

  # Declarative routing (Part P-007). Pinned to 15.1.3, the last version
  # whose stated floor is Flutter 3.27/Dart 3.6 — matching this project's
  # own environment floor above exactly. go_router 15.2.0+ (and all 16.x)
  # bump their floor to Flutter 3.29/Dart 3.7, which the validated
  # real-machine Flutter 3.29.3/Dart 3.7.2 from P-001 also satisfies — so
  # bumping later is safe, but there's no need to require it yet.
  go_router: ^15.1.3

  # HTTP client for future networking layer (lib/core/network)
  dio: ^5.11.0

  # Encrypted local storage for future auth-token persistence (lib/core/storage)
  flutter_secure_storage: ^10.3.1

  # Non-sensitive local cache backing for CacheStorage (lib/core/storage) —
  # tokens never use this, see secure_token_storage.dart. Pinned to 2.5.3:
  # shared_preferences 2.5.4+ requires Flutter >=3.35.0, which is newer
  # than this project's validated Flutter 3.29.3 — the resolver would
  # otherwise silently pick a version that fails to resolve on this SDK,
  # the same class of issue P-001 hit with flutter_riverpod.
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8

  # International phone number input for the Business onboarding/edit
  # forms (Part P-028B), producing an E.164-formattable value to match
  # P-027's backend validation exactly. Pinned to 3.2.0, the current
  # latest on pub.dev at authoring time. ⚠️ Flagged (see
  # business_onboarding_screen.dart's own class docstring, point 4):
  # this package's last real release was published in 2023 and it is
  # not under active development, though it is NOT marked discontinued
  # on pub.dev and has no dependencies beyond the Flutter SDK itself. If
  # `flutter pub get`/`flutter analyze` surface a real incompatibility
  # against this project's pinned flutter_riverpod: 3.3.2 / Flutter
  # >=3.27.0 floor on the real machine, `intl_phone_field_v2` (an
  # actively-maintained fork with the same widget API) is a drop-in
  # replacement — swap this line and the import only, no other files
  # need to change.
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Mocks Dio's HTTP adapter for the P-004 network-layer unit tests
  # (test/core/network/) — lets us assert on status codes/bodies without
  # a real backend running.
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true